[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-api"
version = "0.0.1"
description = "CUE control and LiveKit admission API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "livekit-api>=1.0,<2",
  "openai>=1.50,<4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
# B's face-capture core is pure Python on purpose, so OpenCV stays optional and
# the backend still installs and tests on a machine without a native wheel.
opencv = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
cue-release-finalize = "cue_api.release_finalize_cli:main"
cue-release-preflight = "cue_api.release_preflight_cli:main"
cue-guests = "cue_api.guests.enrolment_cli:main"
cue-stage2-fixture = "cue_api.stage2_fixture_cli:main"
cue-stage4-gate = "cue_api.stage4_gate_cli:main"
cue-offline-handoff = "cue_api.offline_handoff_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
