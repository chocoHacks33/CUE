[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-api"
version = "0.0.1"
description = "CUE control and LiveKit admission API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "livekit-api>=1.0,<2",
  "openai>=1.50,<4",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
