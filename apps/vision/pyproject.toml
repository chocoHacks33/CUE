[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-vision"
version = "0.1.0"
description = "CUE guest identity: detection, quality, calibrated matching and expiry"
requires-python = ">=3.11"
# The core is deliberately dependency-free so it imports and tests on any of the
# four machines. OpenCV is only needed by the adapters that touch real pixels.
dependencies = []

[project.optional-dependencies]
opencv = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
cue-vision = "cue_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
