name: CUE checks

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -e ".[dev]"
        working-directory: apps/api
      - run: python -m pytest -q
        working-directory: apps/api
      - run: python -m ruff check .
        working-directory: apps/api

      # Person B's vision core installs without OpenCV on purpose: the pure
      # policy layer has to build and test on all four machines.
      - run: python -m pip install -e ".[dev]"
        working-directory: apps/vision
      - run: python -m pytest -q
        working-directory: apps/vision
      - run: python -m ruff check .
        working-directory: apps/vision
